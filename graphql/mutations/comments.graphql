# ------------------------------------------------------------
# GraphQL mutations for Linear issue comments
#
# Comments are discussion threads on issues. Each comment has a body
# (markdown-formatted text), author, and timestamp. Comments can be
# nested via replies using parentId.
# ------------------------------------------------------------

# Comment fields fragment
#
# Defines the standard fields for a comment entity. Body is markdown,
# createdAt/editedAt are ISO 8601 timestamps, parentId links to a
# parent comment for threaded replies.
fragment CommentFields on Comment {
  id
  body
  createdAt
  editedAt
  parentId
  resolvedAt
  resolvingUser {
    id
    displayName
  }
  resolvingComment {
    id
  }
  user {
    id
    displayName
  }
  botActor {
    id
    name
    userDisplayName
  }
}

# Create a comment on an issue
#
# Creates a new comment on the specified issue. The comment body
# supports markdown formatting including mentions and code blocks.
#
# Input fields (CommentCreateInput):
#   issueId: UUID of the issue to comment on (required for top-level)
#   parentId: UUID of parent comment (required for replies)
#   body: Comment text in markdown format (required)
#
# Returns: success flag and the created comment with its fields
mutation CreateComment($input: CommentCreateInput!) {
  commentCreate(input: $input) {
    success
    comment {
      ...CommentFields
    }
  }
}

# Update an existing comment
#
# Updates the body of an existing comment.
#
# Variables:
#   id: UUID of the comment to update (required)
#   input: CommentUpdateInput with new body (required)
#
# Returns: success flag and the updated comment with its fields
mutation UpdateComment($id: String!, $input: CommentUpdateInput!) {
  commentUpdate(id: $id, input: $input) {
    success
    comment {
      ...CommentFields
    }
  }
}

# Resolve a comment thread
#
# Marks the root comment as resolved by the current user, collapsing
# the thread in the Linear UI. Only top-level comments (thread roots)
# can be resolved — passing a reply UUID will fail.
#
# Variables:
#   id: UUID of the top-level comment to resolve (required)
#   resolvingCommentId: UUID of the child reply that constitutes the
#                       resolution (optional; surfaced in the UI as the
#                       "resolved by" reply)
#
# Returns: success flag and the updated comment with resolution fields
mutation ResolveComment($id: String!, $resolvingCommentId: String) {
  commentResolve(id: $id, resolvingCommentId: $resolvingCommentId) {
    success
    comment {
      ...CommentFields
    }
  }
}

# Unresolve a previously resolved comment thread
#
# Clears the resolved state on the root comment, re-opening the thread
# in the Linear UI.
#
# Variables:
#   id: UUID of the top-level comment to unresolve (required)
#
# Returns: success flag and the updated comment
mutation UnresolveComment($id: String!) {
  commentUnresolve(id: $id) {
    success
    comment {
      ...CommentFields
    }
  }
}

# Delete a comment
#
# Permanently deletes a comment.
#
# Variables:
#   id: UUID of the comment to delete (required)
#
# Returns: success flag and the entity ID of the deleted comment
mutation DeleteComment($id: String!) {
  commentDelete(id: $id) {
    success
    entityId
  }
}
